<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>绘图调参</title>
<style>:root{--bg: #ffffff;--bg2: #f6f7f9;--fg: #1a1d21;--muted: #6b7280;--line: #e3e6ea;--accent: #0072b2;--danger: #d55e00;--ok: #009e73;--radius: 6px}[data-theme=dark]{--bg: #17191c;--bg2: #1f2226;--fg: #e6e8ea;--muted: #9aa3ad;--line: #2e333a}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font:13px/1.5 Microsoft YaHei,system-ui,-apple-system,sans-serif}body[data-busy]{cursor:progress}#app{position:relative;display:flex;flex-direction:column;height:100%}[hidden]{display:none!important}header{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line);background:var(--bg2)}header input{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--fg);font-family:ui-monospace,Consolas,monospace;font-size:12px}header input:focus{outline:2px solid var(--accent);outline-offset:-1px}button{padding:6px 11px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--fg);font-size:12px;cursor:pointer;white-space:nowrap}button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}button.primary{border-color:var(--accent);color:var(--accent)}button.danger:not(:disabled){border-color:var(--danger);color:var(--danger)}#pickwrap{position:absolute;top:45px;left:8px;right:8px;z-index:40;display:flex;flex-direction:column;max-height:60vh;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 28px #00000052;overflow:hidden}.pick-head{display:flex;gap:6px;padding:6px;border-bottom:1px solid var(--line)}.pick-head input{flex:1;min-width:0;padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);font-size:12px}.pick-head input:focus{outline:2px solid var(--accent);outline-offset:-1px}#picklist{overflow:auto;padding:4px 6px 6px}.pick{display:block;width:100%;text-align:left;border:0;background:transparent;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;padding:3px 6px;border-radius:4px}.pick:hover{background:var(--line)}#scan[data-on="1"]{border-color:var(--accent);color:var(--accent)}main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(230px,300px) 1fr}@media(max-width:720px){main{grid-template-columns:1fr;grid-template-rows:45% 1fr}}#params{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}#paramtools{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg2)}#paramtools input[type=text]{flex:1;min-width:0;padding:4px 7px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);font-size:11.5px}#paramtools .chk{font-size:11px;color:var(--muted);white-space:nowrap}#paramlist{flex:1;min-height:0;overflow:auto;padding:6px 8px}#paramlist details{margin-bottom:4px}#paramfoot{display:flex;align-items:center;gap:8px;padding:5px 8px;border-top:1px solid var(--line);background:var(--bg2);font-size:11px}#paramcount{flex:1}#paramfoot button{padding:3px 8px;font-size:11px}body[data-busy] button{pointer-events:none;opacity:.6}details{margin-bottom:6px}summary{cursor:pointer;padding:3px 2px;color:var(--muted);font-size:11.5px;font-weight:600;user-select:none}.row{display:grid;grid-template-columns:1fr 96px;gap:6px;align-items:center;padding:2px 0 2px 10px}.row .k{font-size:12px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .k code{margin-left:5px;font-family:ui-monospace,Consolas,monospace;font-size:10px;color:var(--muted)}.row[data-touched="1"] .k{color:var(--accent);font-weight:600}.row[data-touched="1"] .k:after{content:" \25cf";font-size:9px}.row input{width:100%;padding:3px 5px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);font-family:ui-monospace,Consolas,monospace;font-size:11.5px}.row input[type=color]{padding:0;height:24px}.row input[type=checkbox]{width:auto;justify-self:start}#view{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}#viewbar{display:flex;align-items:center;gap:10px;font-size:12px}.chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}.chk input{margin:0}#tabs{display:flex;gap:6px}.tab{padding:3px 12px;font-size:12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}.tab[aria-selected=true]{border-color:var(--accent);color:var(--accent);font-weight:600}#pane-fig[hidden],#pane-code[hidden]{display:none!important}#pane-fig,#pane-code{display:flex;flex-direction:column;gap:10px}.codebar{display:flex;align-items:center;gap:8px;font-size:11px}#codemeta{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}pre.code{margin:0;padding:8px 0;max-height:none;overflow:auto;line-height:1.55;font-family:ui-monospace,Consolas,monospace;font-size:11.5px}.cline{display:flex}.cline:hover{background:#7f7f7f14}.cline .n{flex:0 0 auto;width:3.2em;padding-right:8px;text-align:right;color:var(--muted);opacity:.65;user-select:none}.cline .s{white-space:pre}.tok-kw{color:#c792ea}.tok-str{color:#9ccc9c}.tok-com{color:var(--muted);font-style:italic}.tok-num{color:#f0a35e}.tok-dec{color:#82aaff}#askbar{display:flex;gap:6px;padding:6px 8px;border-top:1px solid var(--line);background:var(--bg2)}#askbar input{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--fg);font-size:12px}#askbar input:focus{outline:2px solid var(--accent);outline-offset:-1px}#askbar button{padding:6px 10px}figure{margin:0;display:flex;flex-direction:column;gap:4px}figcaption{font-size:11px;color:var(--muted)}#figcur figcaption{display:none}#view.compare #figcur figcaption{display:block}#view.compare #figorig{padding-bottom:8px;border-bottom:1px dashed var(--line)}#img,#imgorig{max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}#empty{color:var(--muted);font-size:12px;text-align:center;padding:40px 10px;border:1px dashed var(--line);border-radius:var(--radius)}#warn{padding:7px 10px;border:1px solid #b8860b;border-left:3px solid #d55e00;border-radius:var(--radius);background:#d55e0014;color:var(--fg);font-size:11.5px;line-height:1.5}pre{margin:4px 0;padding:8px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);font-size:11px;line-height:1.45;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all}footer{display:flex;align-items:center;gap:8px;padding:8px;background:var(--bg2)}#status{font-size:11.5px;color:var(--muted);margin-left:auto}#status[data-kind=error]{color:var(--danger)}#status[data-kind=ok]{color:var(--ok)}.muted{color:var(--muted)}.hint{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div id="app">
  <header>
    <input id="script" type="text" spellcheck="false"
           placeholder="工作区内的 .py 路径，例如 07_脚本与工具/fig12.py" />
    <button id="inspect" class="primary">读取参数</button>
    <button id="scan">扫描</button>
  </header>

  <!-- 脚本列表：浮层，选完即收，不占版面 -->
  <div id="pickwrap" hidden>
    <div class="pick-head">
      <input id="pickfilter" type="text" spellcheck="false" placeholder="过滤文件名…" />
      <button id="pickclose">收起</button>
    </div>
    <div id="picklist"></div>
  </div>

  <main>
    <aside id="params">
      <div id="paramtools">
        <input id="paramfilter" type="text" spellcheck="false" placeholder="搜索参数…" />
        <label class="chk"><input id="onlychanged" type="checkbox" /> 只看已改</label>
      </div>
      <div id="paramlist">
        <p class="hint">还没有参数。先填脚本路径，点「读取参数」；不知道有哪些脚本就点「扫描」。</p>
      </div>
      <div id="paramfoot" hidden>
        <span id="paramcount" class="muted">未改动</span>
        <button id="paramclear">清空改动</button>
      </div>
    </aside>
    <section id="view">
      <div id="tabs" hidden>
        <button class="tab" data-tab="fig" aria-selected="true">预览</button>
        <button class="tab" data-tab="code" aria-selected="false">源码</button>
      </div>

      <div id="pane-fig">
        <div id="empty">调好参数后点「重画」，图会出现在这里</div>
        <div id="warn" hidden></div>

        <div id="viewbar" hidden>
          <label class="chk"><input id="compare" type="checkbox" /> 对照原图</label>
          <button id="peek" type="button">按住看原图</button>
        </div>

        <figure id="figorig" hidden>
          <figcaption>原图 · 脚本原本的样式</figcaption>
          <img id="imgorig" alt="原图" />
        </figure>

        <figure id="figcur" hidden>
          <figcaption id="capcur">当前</figcaption>
          <img id="img" alt="预览" />
        </figure>
      </div>

      <div id="pane-code" hidden>
        <div class="codebar">
          <span id="codemeta" class="muted"></span>
          <button id="coderefresh">刷新</button>
        </div>
        <pre id="code" class="code"></pre>
      </div>

      <details id="diffbox">
        <summary>改动预览</summary>
        <pre id="diff"></pre>
        <pre id="skipped" class="muted"></pre>
      </details>
      <details>
        <summary>脚本输出</summary>
        <pre id="log"></pre>
      </details>
    </section>
  </main>

  <div id="askbar">
    <input id="ask" type="text" spellcheck="false" placeholder="告诉 AI 还要改什么…" />
    <button id="asksend">发送</button>
  </div>

  <footer>
    <button id="render">重画</button>
    <button id="plan">预览改动</button>
    <button id="apply" class="danger">写回源码</button>
    <span id="count" class="muted"></span>
    <span id="status"></span>
  </footer>
</div>
